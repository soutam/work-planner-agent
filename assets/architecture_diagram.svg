<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff8e53"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers for Connectors -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <rect width="1000" height="580" fill="url(#bg-grad)"/>

  <!-- Title Banner -->
  <g transform="translate(40, 30)">
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">Personal Work Planner Agent</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13" font-weight="400">System Architecture & Service Flow</text>
  </g>

  <!-- 1. Client Layer Section -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="180" height="420" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#38bdf8"/>
    <text x="20" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CLIENT LAYER</text>

    <!-- Client Icon Node -->
    <g transform="translate(20, 60)">
      <circle cx="70" cy="50" r="36" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <!-- Monitor Icon -->
      <path d="M52 36 h36 a3 3 0 0 1 3 3 v22 a3 3 0 0 1 -3 3 h-36 a3 3 0 0 1 -3 -3 v-22 a3 3 0 0 1 3 -3 z M64 64 h12 M70 64 v8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="70" y="110" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Web Chat UI</text>
      <text x="70" y="128" fill="#94a3b8" font-size="11" text-anchor="middle">A2UI Cards & Badges</text>
      <text x="70" y="144" fill="#94a3b8" font-size="11" text-anchor="middle">Dark Mode & Chips</text>
    </g>
  </g>

  <!-- Connector: Client -> Frontend -->
  <path d="M 220 310 L 270 310" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="245" y="300" fill="#818cf8" font-size="10" font-weight="600" text-anchor="middle">HTTP /chat</text>

  <!-- 2. Frontend Layer Section -->
  <g transform="translate(280, 100)" filter="url(#shadow)">
    <rect width="180" height="420" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#a855f7"/>
    <text x="20" y="32" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="1">FRONTEND PROXY</text>

    <!-- FastAPI Server Icon Node -->
    <g transform="translate(20, 60)">
      <circle cx="70" cy="50" r="36" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <!-- Lightning Rocket Icon -->
      <path d="M70 32 L58 52 h12 L66 68 L82 48 h-12 z" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="70" y="110" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">FastAPI Server</text>
      <text x="70" y="128" fill="#94a3b8" font-size="11" text-anchor="middle">main.py Proxy</text>
      <text x="70" y="144" fill="#94a3b8" font-size="11" text-anchor="middle">A2A Endpoint Handler</text>
    </g>
  </g>

  <!-- Connector: Frontend -> Agent Engine -->
  <path d="M 460 310 L 510 310" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="485" y="300" fill="#818cf8" font-size="10" font-weight="600" text-anchor="middle">A2A Protocol</text>

  <!-- 3. ADK Agent Engine Section -->
  <g transform="translate(520, 100)" filter="url(#shadow)">
    <rect width="200" height="420" rx="16" fill="url(#card-grad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#accent-grad)"/>
    <text x="20" y="32" fill="#818cf8" font-size="12" font-weight="700" letter-spacing="1">ADK AGENT ENGINE</text>

    <!-- Brain Agent Icon Node -->
    <g transform="translate(30, 50)">
      <circle cx="70" cy="45" r="34" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
      <!-- Brain Icon -->
      <path d="M56 45 c-4 -8 2 -16 10 -14 c4 -6 14 -6 18 0 c8 -2 14 6 10 14 c4 8 -2 16 -10 14 c-4 6 -14 6 -18 0 c-8 2 -14 -6 -10 -14 z" fill="none" stroke="#818cf8" stroke-width="2"/>
      <text x="70" y="98" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Root Agent</text>
      <text x="70" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">gemini-flash-latest</text>
    </g>

    <!-- Sub-node: Code Executor -->
    <g transform="translate(15, 185)">
      <rect width="170" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="42" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Calculator / Code Icon -->
      <path d="M24 38 l4 4 l-4 4 M36 38 l-4 4 l4 4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="38" fill="#f8fafc" font-size="11" font-weight="600">Code Executor</text>
      <text x="56" y="54" fill="#94a3b8" font-size="10">Agent Engine Sandbox</text>
    </g>

    <!-- Sub-node: Memory Bank -->
    <g transform="translate(15, 290)">
      <rect width="170" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="42" r="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <!-- Database/Memory Icon -->
      <path d="M23 37 c0 -3 7 -5 14 -5 s14 2 14 5 v10 c0 3 -7 5 -14 5 s-14 -2 -14 -5 z M23 42 c0 3 7 5 14 5 s14 -2 14 -5" fill="none" stroke="#10b981" stroke-width="1.8"/>
      <text x="56" y="38" fill="#f8fafc" font-size="11" font-weight="600">Memory Bank</text>
      <text x="56" y="54" fill="#94a3b8" font-size="10">Session Context & Recall</text>
    </g>
  </g>

  <!-- 4. Google Cloud Services & APIs Section -->
  <g transform="translate(760, 100)" filter="url(#shadow)">
    <rect width="200" height="420" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#38bdf8"/>
    <text x="20" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CLOUD &amp; SERVICES</text>

    <!-- Service Node 1: Firestore -->
    <g transform="translate(15, 50)">
      <rect width="170" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#1e293b" stroke="#ff6b6b" stroke-width="1.5"/>
      <text x="30" y="35" fill="#ff6b6b" font-size="14" font-weight="bold" text-anchor="middle">🔥</text>
      <text x="55" y="28" fill="#f8fafc" font-size="11" font-weight="600">Firestore DB</text>
      <text x="55" y="42" fill="#94a3b8" font-size="9.5">Task Backlog CRUD</text>
    </g>

    <!-- Service Node 2: Cloud Storage -->
    <g transform="translate(15, 120)">
      <rect width="170" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="35" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">📦</text>
      <text x="55" y="28" fill="#f8fafc" font-size="11" font-weight="600">Cloud Storage</text>
      <text x="55" y="42" fill="#94a3b8" font-size="9.5">Reports &amp; Public Assets</text>
    </g>

    <!-- Service Node 3: Vertex AI Image -->
    <g transform="translate(15, 190)">
      <rect width="170" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="30" y="35" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="middle">🎨</text>
      <text x="55" y="28" fill="#f8fafc" font-size="11" font-weight="600">Vertex AI Image</text>
      <text x="55" y="42" fill="#94a3b8" font-size="9.5">gemini-3.1-flash-lite-image</text>
    </g>

    <!-- Service Node 4: Grounded RAG -->
    <g transform="translate(15, 260)">
      <rect width="170" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="30" y="35" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">📚</text>
      <text x="55" y="28" fill="#f8fafc" font-size="11" font-weight="600">RAG Grounding</text>
      <text x="55" y="42" fill="#94a3b8" font-size="9.5">Recipe Corpus Search</text>
    </g>

    <!-- Service Node 5: ZenQuotes API -->
    <g transform="translate(15, 330)">
      <rect width="170" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="30" y="35" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">🌐</text>
      <text x="55" y="28" fill="#f8fafc" font-size="11" font-weight="600">ZenQuotes API</text>
      <text x="55" y="42" fill="#94a3b8" font-size="9.5">Daily Focus Motivation</text>
    </g>
  </g>

  <!-- Connectors from Agent Engine to Cloud Services -->
  <path d="M 720 180 L 775 180" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 250 L 775 250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 320 L 775 320" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 390 L 775 390" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 460 L 775 460" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
